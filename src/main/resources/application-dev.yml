server:
  port: 8080

spring:
  web:
    error:
      include-stacktrace: never

  datasource:
    url: jdbc:h2:mem:develop_db
    username: sa
    password: password
    driverClassName: org.h2.Driver

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    hibernate:
      ddl-auto: create

  messages:
    encoding: UTF-8

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

